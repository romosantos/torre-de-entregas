<style>
/* Layout: torre de controle dark-first. Cabeçalho + faixa de KPIs; fila de alertas à esquerda, mapa à direita; telas de rotas, ocorrências, relatório e app do motorista (celular). */
:root{

  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef1f4;--panel:#fff;--panel2:#f1f4f6;--line:#d5dce2;--fg:#14202a;--mut:#566673;
  --acc:#b87500;--acc-fg:#fff;--ok:#16805e;--info:#2a58c8;--warn:#a05e00;--bad:#c0392b;--shadow:0 8px 24px rgba(20,32,42,.15);color-scheme:light}}
:root[data-theme="light"]{--bg:#eef1f4;--panel:#fff;--panel2:#f1f4f6;--line:#d5dce2;--fg:#14202a;--mut:#566673;
  --acc:#b87500;--acc-fg:#fff;--ok:#16805e;--info:#2a58c8;--warn:#a05e00;--bad:#c0392b;--shadow:0 8px 24px rgba(20,32,42,.15);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px 24px;min-height:100%}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font:700 26px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:22px;background:var(--acc);display:inline-block;transform:skewX(-14deg)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:7px 12px;border-radius:6px;color:var(--mut);text-decoration:none;font-weight:500;border:1px solid transparent}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);background:var(--panel);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--acc)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px var(--f-mono);color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font:500 12px var(--f-body);white-space:nowrap}
.chip.demo{border-color:var(--acc);color:var(--acc)}
.hm{}
.rv{display:grid;gap:12px}
@media print{header,.noprint,.backlink,#layer,.toast{display:none!important}body{background:#fff!important;color:#000!important}.panel{break-inside:avoid;background:#fff!important;border-color:#bbb!important}.sub,.tl time{color:#444!important}}
@media(max-width:700px){.hm{display:none}}
.chip.bad{border-color:var(--bad);color:var(--bad);font-weight:600}.chip.ok{border-color:var(--ok);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi{position:relative}
a.kpi{display:block;color:inherit;text-decoration:none;cursor:pointer}
a.kpi::after{content:'›';position:absolute;right:10px;top:8px;color:var(--mut);font-size:18px}
a.kpi:hover{border-color:var(--acc)}
a.kpi:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kpi b{display:block;font:600 28px/1.05 var(--f-disp);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12px}
.kpi.k-ok b{color:var(--ok)}.kpi.k-info b{color:var(--info)}.kpi.k-warn b{color:var(--warn)}.kpi.k-bad b{color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel h2{margin:0;padding:10px 12px;font:600 17px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font:400 12px var(--f-body);color:var(--mut);letter-spacing:0;text-transform:none}
.queue{max-height:calc(100vh - 250px);min-height:320px;overflow:auto;display:flex;flex-direction:column}
.alert{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px;cursor:pointer;border-left:4px solid var(--warn)}
.alert.s2{border-left-color:var(--bad)}
.alert:hover,.alert.sel{background:var(--panel2)}
.alert.done{opacity:.55;border-left-color:var(--ok)}
.alert .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sev{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.sev.s2{color:var(--bad)}.sev.s1{color:var(--warn)}.sev.s0{color:var(--ok)}
.alert h3{margin:0;font-size:14px;font-weight:600}
.alert p{margin:0;color:var(--mut);font-size:12.5px}
.recban{margin:0 0 12px;border:1px solid var(--bad);border-left-width:4px;border-radius:8px;padding:10px 12px;background:color-mix(in srgb,var(--bad) 12%,var(--panel));display:grid;gap:8px}
.recban.info{display:block;border-color:var(--line);border-left-color:var(--info);background:var(--panel);color:var(--mut);font-size:13px}
.recban .it{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recban .it .sp{flex:1}
.alert.cp{padding:8px 12px;gap:4px}.alert.cp .top{justify-content:flex-start}.alert.cp h3{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alert.cp .row2{display:flex;align-items:center;gap:8px}.alert.cp .row2 .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qmed{width:100%;text-align:left;padding:10px 12px;background:var(--panel2);border:0;border-bottom:1px solid var(--line);color:var(--fg);font:600 13px var(--f-ui,inherit);cursor:pointer}.chips1{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px}.chips1 .fchip{flex:none}.democtl{display:inline-flex;gap:6px;align-items:center;padding:2px 6px;border:1px dashed var(--line);border-radius:8px}.democtl>span{font:600 10px var(--f-mono);color:var(--mut);letter-spacing:.08em}.democtl .btn{font-size:11px}
.sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px;max-height:620px;overflow:auto}.sm-t{display:grid;gap:3px;text-align:left;padding:8px 9px;border-radius:8px;border:1px solid var(--line);border-left-width:5px;background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit;min-height:74px}.sm-t:hover,.sm-t.sel{background:var(--panel);box-shadow:0 0 0 2px var(--fg) inset}.sm-t b{font:700 13px var(--f-mono)}.sm-t .l{font-size:11px;color:var(--mut)}.sm-t .n{font:700 18px var(--f-mono);line-height:1}.sm-t.v{border-left-color:var(--bad)}.sm-t.a{border-left-color:var(--warn)}.sm-t.g{border-left-color:var(--ok)}.sm-t.c{opacity:.6}.sm-t .bar{height:5px}.tabs2{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}.sm-leg{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px 0;font-size:12px;color:var(--mut)}
.kpis{gap:6px}.kpi{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;padding:6px 12px}.kpi b{font-size:22px}
.mapwrap.sem{grid-template-columns:minmax(0,1fr)}.mapwrap.sem .drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);max-height:none;min-height:0;z-index:40;background:var(--panel);box-shadow:-12px 0 32px rgba(0,0,0,.45)}
.sm{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;padding:10px}.sm-t{min-height:0;padding:6px 8px;gap:2px}.sm-t .n{font-size:15px}.sm-t .l{display:none}.sm-t .row2{display:flex;align-items:baseline;gap:4px}.sm-t .row2 .l2{font-size:11px;color:var(--mut)}
.sm-t.v,.sm-t.a,.sm-t.g{border-left-color:var(--line)}.sm-t .mk2{margin-left:auto;font-size:11px}.sm-t .bar{height:6px}
.queue.cases{max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;padding:10px 12px}.queue.cases .alert{border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--panel2)}.queue.cases .alert.s2{border-left-color:var(--bad)}.queue.cases .alert.s1{border-left-color:var(--warn)}.queue.cases .qmed{grid-column:1/-1;border:1px solid var(--line);border-radius:8px}.alert.cp.sel{box-shadow:0 0 0 2px var(--fg) inset}.alert.cp .trunc{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zh{display:flex;align-items:baseline;gap:8px;padding:12px 12px 0;margin:0;font:600 13px var(--f-disp,inherit);letter-spacing:.06em;text-transform:uppercase}.zh small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--mut)}
.alert.cp{min-width:0;overflow:hidden;grid-template-columns:minmax(0,1fr)}.alert.cp>*{min-width:0}.queue.cases{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.queue>.alert,.queue>.qmed{flex-shrink:0}
.alert.recdue{box-shadow:inset 0 0 0 1px var(--bad)}
.recstrip{font:600 12px var(--f-mono);color:var(--bad);text-transform:uppercase;letter-spacing:.04em}
.sla{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.sla.late{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
@media(max-width:700px){
body{padding-inline:12px}
header{gap:8px}
.brand{font-size:20px}

.backlink{display:none}

}

table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}

  const lib=ev.find(e=>/liberada/i.test(e.t)),saida=ev.find(e=>/Saída do CD/.test(e.t));
  const row=(k,v)=>`<tr><td class="sub" style="width:38%">${k}</td><td>${v}</td></tr>`;
  return `<div class="row noprint"><a class="btn" href="#rota-${id}" style="text-decoration:none">← Rota</a><span class="sp"></span><button class="btn pri" data-act="print">Imprimir ou salvar em PDF</button></div>
  <div class="rv"><h1>Relatório da viagem · Rota ${lab(r)}</h1><div class="sub">Operação de 08/10/2026 · gerado automaticamente do histórico às ${hhmm(demoMin())} · dados fictícios</div>
  <section class="panel"><h2>Identificação</h2><div class="tw"><table class="wrap"><tbody>${row('Motorista',esc(r.mot))}${row('Veículo',esc(r.placa))}${row('Unidade',esc(r.unid))}${row('Responsável',esc(r.dono)+(r.dono!==r.titular?` · cobrindo ${esc(r.titular||'sem titular')} (ausente)`:''))}${row('Liberação',lib?hhmm(lib.m)+' · '+esc(lib.u||''):'—')}${row('Saída do CD',saida?hhmm(saida.m):'—')}${row('Encerramento',E.ok?hhmm(E.ok.m)+' · '+esc(E.ok.u):'Em andamento')}</tbody></table></div></section>
  <section class="panel"><h2>Resultado</h2><div class="tw"><table class="wrap"><tbody>${row('Paradas',s.n)}${row('Entregues',`${s.Entregue} (${pct(s.Entregue,s.n)}%)`)}${row('Pendentes',s.Pendente)}${row('Reentregas',s.Reentrega)}${row('Devoluções',s.Devolvida)}${row('Valor total',fmt$(s.val)+' · '+fmtN(s.peso)+' kg')}</tbody></table></div></section>
  <section class="panel"><h2>Paradas e evidências</h2><div class="tw"><table class="wrap"><thead><tr><th>#</th><th>Cliente</th><th>NF</th><th>Situação e evidência</th></tr></thead><tbody>${r.stops.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.cli)}</td><td style="font-family:var(--f-mono)">${x.nf}</td><td>${stChip(x.st)}${x.motivo?`<div class="sub">${esc(MOT[x.motivo]||'')}</div>`:''}<div class="sub">${x.evid?`${hhmm(x.evid.m)} · recebido por ${esc(x.evid.rec)}${x.evid.doc?' ('+esc(x.evid.doc)+')':''} · foto do canhoto · ${esc(x.evid.local)}`:(x.st==='Entregue'?'Sem evidência digital (dado do dia)':'')}</div></td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Alertas e tratativas <small>${al.length}</small></h2>${al.length?`<div class="tw"><table class="wrap"><thead><tr><th>Caso</th><th>Gravidade</th><th>Estado</th><th>1ª resposta</th><th>Tentativas sem resposta</th></tr></thead><tbody>${al.map(a=>`<tr><td>${esc(a.kind)}<div class="sub">${a.itens.map(esc).join('<br>')}</div></td><td>${a.sev===2?'Alta':'Média'}</td><td>${a.estado}${a.decisao?` · ${esc(a.decisao)}`:''}</td><td>${a.resp!=null?a.resp+' min':'sem tratativa'}</td><td>${a.sem||0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="pad sub">Nenhum alerta nesta viagem.</div>'}</section>
  <section class="panel"><h2>Contatos realizados <small>${ct.length}</small></h2>${ct.length?`<ul class="tl">${ct.map(e=>`<li><time>${hhmm(e.m)}</time><span>${esc(e.t)} <small class="sub">· ${esc(e.u||'')}</small></span></li>`).join('')}</ul>`:'<div class="pad sub">Nenhum contato registrado.</div>'}</section>
  <section class="panel"><h2>Checklists e conformidade</h2><div class="tw"><table class="wrap"><tbody>${row('Checklist de saída',L&&L.ok?LREC.map(([k,t])=>`${L.chk[k]?'✓':'✗'} ${t}`).join('<br>'):'Rota liberada antes do período simulado')}${row('Exceção de liberação',L&&L.exc?`Aprovada por ${esc(L.exc.ap)}: ${esc(L.exc.ju)}`:(L&&L.pedido?'Solicitada, aguardando supervisor':'Nenhuma'))}${row('Checklist de encerramento',ENCI.map(([k,t])=>`${E.chk[k]?'✓':'✗'} ${t}`).join('<br>'))}</tbody></table></div></section>
  <section class="panel"><h2>Linha do tempo completa <small>${ev.length} eventos, com autor</small></h2><ul class="tl">${ev.map(e=>`<li><time>${hhmm(e.m)}</time><span>${esc(e.t)} <small class="sub">· ${esc(e.u||'Sistema')}</small></span></li>`).join('')}</ul></section>
  <div class="sub">Conclusão: ${s.Entregue} de ${s.n} paradas entregues${s.Pendente?`, ${s.Pendente} pendentes`:''}${s.Devolvida||s.Reentrega?`, ${s.Reentrega} reentregas e ${s.Devolvida} devoluções`:''}; ${al.length} alerta${al.length===1?'':'s'}, ${ct.length} contato${ct.length===1?'':'s'}. ${E.ok?'Viagem encerrada com checklist completo.':'Viagem ainda não encerrada.'}</div></div>`}

function rotas(){
  const list=[...R].filter(r=>!uf||r.unid===uf).sort((a,b)=>stats(b.stops).Pendente-stats(a.stops).Pendente);
  return `${kpis()}<section class="panel"><h2>Rotas do dia <small>ordenadas por NFs pendentes</small></h2><div class="pad" style="padding-bottom:0">${ufBar()}</div><div class="tw"><table><thead><tr><th>Rota</th><th class="hm">Unidade</th><th>Motorista</th><th>Placa</th><th class="n">NFs</th><th>Progresso</th><th class="n">Entreg.</th><th class="n">Pend.</th><th class="n">Reent.</th><th class="n">Dev.</th><th class="n">Valor</th><th>Último dado</th><th>Alerta</th></tr></thead><tbody>
  ${list.map(r=>{const s=stats(r.stops),a=ALERTS.find(x=>x.rota===r.id&&x.estado==='Novo');return `<tr class="click" data-open="${r.id}"><td><b>${lab(r)}</b></td><td class="sub hm">${esc(r.unid)}</td><td>${esc(r.mot)}</td><td class="sub" style="font-family:var(--f-mono)">${esc(r.placa)}</td><td class="n">${s.n}</td><td style="min-width:120px">${barOf(s)}</td><td class="n">${s.Entregue}</td><td class="n">${s.Pendente}</td><td class="n">${s.Reentrega}</td><td class="n">${s.Devolvida}</td><td class="n">${fmt$(s.val)}</td><td>${ativa(r)?freshChip(r):'<span class="sub">—</span>'}</td><td>${a?`<span class="sev s${a.sev}">${a.sev===2?'Alta':'Média'}</span>`:'<span class="sub">—</span>'}</td></tr>`}).join('')}</tbody></table></div></section>`}

const BADMAP={'SEM PEDIDO':'ped','DUPLICIDADE DE PEDIDO':'dup','SEM AGENDAMENTO':'age','PEDIDO CANCELADO PELO CLIENTE':'ati'};

const LREC=[['veic','Veículo vistoriado'],['mot','Motorista apto'],['lacre','Lacre conferido'],['nfs','NFs conferidas']];
const LIBR=(()=>{const bad=R.filter(r=>r.stops.some(s=>BADMAP[s.motivo])),clean=R.filter(r=>!r.stops.some(s=>BADMAP[s.motivo])&&r.stops.length>=4).slice(0,3);
  return [...bad,...clean].map(r=>({id:r.id,r,stops:r.stops.map(s=>({nf:s.nf,cli:s.cli,cidade:s.cidade,valor:s.valor,falha:BADMAP[s.motivo]||null}))}))})();
const LIB={};LIBR.forEach(l=>LIB[l.id]={chk:{},rem:[],exc:null,ok:null});
let selLib=(LIBR.find(l=>l.stops.some(s=>s.falha))||LIBR[0]).id;
const lBlk=l=>l.stops.filter(s=>s.falha&&!LIB[l.id].rem.includes(s.nf));
const lCan=l=>LREC.every(([k])=>LIB[l.id].chk[k])&&(!lBlk(l).length||LIB[l.id].exc);
function liberacao(){
  const tot=LIBR.reduce((a,l)=>a+l.stops.filter(s=>s.falha).length,0),lib=LIBR.filter(l=>LIB[l.id].ok).length,l=LIBR.find(x=>x.id===selLib),S=LIB[l.id],blk=lBlk(l);
  return `<h1>Liberação de rotas</h1><div class="note" style="margin:0">Simulação: as NFs do dia 08/10 são usadas como se fossem a carga do dia seguinte. A validação barra, antes da saída, as falhas que hoje só aparecem depois da tentativa.</div>
  <div class="kpis"><a class="kpi" href="#liberacao" data-go="lib:todas" title="Ver a lista"><b>${LIBR.length}</b><span>Rotas a liberar</span></a><a class="kpi k-ok" href="#liberacao" data-go="lib:ok" title="Ver a lista"><b>${lib}</b><span>Liberadas</span></a><a class="kpi k-bad" href="#liberacao" data-go="lib:blk" title="Ver a lista"><b>${tot}</b><span>NFs com bloqueio</span></a><a class="kpi k-warn" href="#liberacao" data-go="lib:res" title="Ver a lista"><b>${tot-LIBR.reduce((a,x)=>a+lBlk(x).length,0)}</b><span>Resolvidas antes da saída</span></a></div>

  ${LIBR.map(x=>{const b=lBlk(x).length,o=LIB[x.id];return `<tr class="click ${x.id===selLib?'sel':''}" data-act="lsel" data-id="${x.id}"><td><b>${lab(x.r)}</b></td><td>${esc(x.r.mot)}</td><td class="n">${x.stops.length}</td><td>${o.ok?'<span class="st Entregue">Liberada</span>':(b?`<span class="sev s2">${b} bloq.</span>`:'<span class="sev s0">Pronta</span>')}</td></tr>`}).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Rota ${lab(l.r)} <small>${esc(l.r.mot)} · ${esc(l.r.placa)}</small></h2><div class="pad" style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px">

  <div><label class="l">Validação por NF</label><div class="tw"><table class="cmp"><thead><tr><th>NF</th><th>Cliente</th>${CHK.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>
  ${l.stops.map(s=>{const rem=S.rem.includes(s.nf);return `<tr style="${rem?'opacity:.45':''}"><td style="font-family:var(--f-mono)">${s.nf}</td><td>${esc(s.cli)}</td>${CHK.map(([k])=>`<td>${s.falha===k?'<span class="st Devolvida">Falhou</span>':'<span class="st Entregue">OK</span>'}</td>`).join('')}<td>${s.falha&&!rem?`<button class="btn sm" data-act="lrem" data-id="${l.id}" data-nf="${s.nf}">Retirar da rota</button>`:(rem?'<span class="sub">retirada</span>':'')}</td></tr>`}).join('')}</tbody></table></div></div>
  ${blk.length&&!S.exc?`<div class="note" style="margin:0;border-left:4px solid var(--bad)"><b style="color:var(--fg)">${blk.length} NF${blk.length>1?'s':''} com bloqueio.</b> Retire da rota ou libere com exceção aprovada por supervisor.${S.pedido&&role!=='supervisor'?`<div style="margin-top:8px;color:var(--fg)">Exceção solicitada ao supervisor: ${esc(S.pedido.ju)}. Aguardando aprovação.</div>`:`<div class="row" style="margin-top:8px"><input type="text" id="l-ju" placeholder="Justificativa" value="${esc(fv['l-ju']||(S.pedido?S.pedido.ju:''))}" style="flex:1;min-width:160px"><button class="btn" data-act="lexc" data-id="${l.id}">${role==='supervisor'?'Aprovar exceção':'Solicitar exceção ao supervisor'}</button></div>`}${S.negada?'<div style="margin-top:6px;color:var(--bad)">Última solicitação negada pelo supervisor.</div>':''}</div>`:''}
  ${S.exc?`<div class="note" style="margin:0">Exceção aprovada por <b style="color:var(--fg)">${esc(S.exc.ap)}</b>: ${esc(S.exc.ju)}</div>`:''}

  else if(a==='traf'){TRAF.modo=TRAF.modo==='Intenso'?'Normal':'Intenso';buildAlerts();logAud('Integração','Trânsito simulado: '+TRAF.modo+' (demo)',null);render();toast('Trânsito '+TRAF.modo.toLowerCase()+' (simulado)')}
  else if(a==='sigback'){delete STALE[id];logEv(id,'Sinal do motorista restabelecido (simulado)','Sistema');buildAlerts();render();toast('Sinal restabelecido')}
  else if(a==='audchk'){const b=audBad();logAud('Auditoria',b.length?`Verificação de integridade: FALHA na(s) entrada(s) ${b.join(', ')}`:'Verificação de integridade: cadeia íntegra');toast(b.length?'Falha de integridade':'Cadeia íntegra');render()}
  else if(a==='audtamper'){if(AUD_BAK){AUD[AUD_K]=AUD_BAK;AUD_BAK=null}else{AUD_K=1;AUD_BAK=AUD[1];AUD[1]=Object.freeze({...AUD[1],t:AUD[1].t+' [alterado]'})}render()}
  else if(a==='ovadd'){const tipo=document.getElementById('ov-tipo').value,alvo=document.getElementById('ov-alvo').value.trim(),vals={};
    OVK.forEach(k=>{const el=document.getElementById('ov-'+k),v=el.value.trim();if(v!==''){let n=Math.round(+v);if(isFinite(n)){n=Math.min(+el.max,Math.max(+el.min,n));vals[k]=n}}});
    const ok=tipo==='Cliente'?cliList().some(c=>c.cli===alvo):R.some(r=>lab(r)===alvo);
    if(!alvo||!ok){toast(tipo==='Cliente'?'Escolha um cliente da lista':'Informe uma rota, como R435');return}
    if(!Object.keys(vals).length){toast('Informe ao menos um valor');return}
    const i=OVR.findIndex(x=>x.tipo===tipo&&x.alvo===alvo);if(i>=0)OVR[i].vals={...OVR[i].vals,...vals};else OVR.push({tipo,alvo,vals});
    saveOvr();logAud('Parâmetro',`Exceção para ${tipo.toLowerCase()} ${alvo}: ${Object.entries(vals).map(([k,v])=>`${parLabel(k)} = ${v}`).join('; ')}`);buildAlerts();render();toast('Exceção adicionada')}
  else if(a==='ovdel'){const x=OVR[id];if(x){OVR.splice(id,1);saveOvr();logAud('Parâmetro',`Exceção removida de ${x.tipo.toLowerCase()} ${x.alvo}`);buildAlerts();render();toast('Exceção removida')}}
  else if(a==='enchk'){const E=ENC[id]??={chk:{},ok:null};E.chk[t.dataset.k]=!E.chk[t.dataset.k];render()}
  else if(a==='encok'){const E=ENC[id];if(E&&ENCI.every(([k])=>E.chk[k])){E.ok={m:demoMin(),u:actor()};logEv(id,'Viagem encerrada com checklist completo (lacre, NFs e canhotos, ocorrências, veículo)');logAud('Checklist','Checklist de encerramento concluído',id);toast('Viagem encerrada');render()}}
  else if(a==='print'){try{window.print()}catch(x){toast('Use Ctrl+P para imprimir')}}
  else if(a==='assume'){const x=ALERTS.find(z=>z.id===t.dataset.id);if(x&&x.dono!==actor()){const ant=x.dono;x.dono=actor();x.man=true;logEv(x.rota,`Caso assumido por ${actor()}${ant?` (estava com ${ant})`:''}`);toast(ant?`Caso passado de ${ant} para você`:'Caso assumido');render()}}
  else if(a==='qf'){qf=t.dataset.v;render()}
  else if(a==='mute'){MUTE=!MUTE;try{localStorage.setItem('torre_mute',MUTE?'1':'0')}catch(x){}render();toast(MUTE?'Som desligado para você':'Som ligado')}
  else if(a==='conton'){CONT.on=true;CONT.since=demoMin();logAud('Contingência','Modo de contingência ativado');render()}
  else if(a==='contoff'){const n=CONT.notas.filter(x=>!x.ok).length;CONT.on=false;logAud('Contingência',`Modo de contingência encerrado${n?` com ${n} anotação(ões) sem lançar`:''}`);render()}
  else if(a==='contadd'){const rid=+document.getElementById('ct-rota').value,txt=document.getElementById('ct-txt').value.trim();if(!txt){toast('Escreva a anotação');return}CONT.notas.push({m:demoMin(),rid,txt,u:actor(),ok:false});logAud('Contingência',`Anotação na rota ${lab(byId(rid))}: ${txt}`,rid);render()}
  else if(a==='contlanca'){if(FEED.down)return;let n=0;CONT.notas.filter(x=>!x.ok).forEach(x=>{logEv(x.rid,`[Lançado após a contingência, anotado às ${hhmm(x.m)}] ${x.txt}`,x.u);x.ok=true;n++});if(n){logAud('Contingência',`${n} anotação(ões) lançada(s) nas rotas`);toast(n+' lançada(s)');render()}}
  else if(a==='cfgreset'){const ch=Object.keys(CFG0).filter(k=>CFG[k]!==CFG0[k]);if(ch.length)logAud('Parâmetro','Restaurou os padrões: '+ch.map(k=>`${parLabel(k)} ${CFG[k]} → ${CFG0[k]}`).join('; '));Object.assign(CFG,CFG0);saveCfg();buildAlerts();render();toast('Parâmetros restaurados')}
  else if(a==='nfst'){nfFilt.st=t.dataset.v;render()}
  else if(a==='clsel'){cliSel=t.dataset.v;render()}
  else if(a==='clonly'){cliOnly=true;cliRec=false;render()}
  else if(a==='clrec'){cliRec=true;cliOnly=true;render()}
  else if(a==='clall'){cliOnly=false;cliRec=false;render()}
  else if(a==='adv'){T0-=10*60000;buildAlerts();checkDue();render()}
  else if(a==='tsug'){fv['t-txt']=sugTurno();render();toast('Sugestão atualizada')}
  else if(a==='hand'){const txt=(document.getElementById('t-txt').value||'').trim(),de=fv['t-de']||'Analista A';if(!txt){toast('Escreva o recado para o próximo turno');return}
    const ab=ALERTS.filter(x=>x.estado==='Novo');HAND.unshift({m:demoMin(),de,para:de==='Analista A'?'Analista B':'Analista A',txt,abertos:ab.length,alta:ab.filter(x=>x.sev===2).length});fv['t-txt']='';logAud('Passagem de turno',`${de} para ${de==='Analista A'?'Analista B':'Analista A'}: ${ab.length} alertas abertos (${ab.filter(x=>x.sev===2).length} altos)`);toast('Passagem registrada');render()}
  else if(a==='copyscr'){const tx=document.getElementById('scr').textContent;(navigator.clipboard?.writeText(tx)||Promise.reject()).then(()=>toast('Fala copiada')).catch(()=>toast('Selecione o texto e copie'))}
  else if(a==='copy'){const tx=resumoTxt();(navigator.clipboard?.writeText(tx)||Promise.reject()).then(()=>toast('Resumo copiado')).catch(()=>{toast('Copie manualmente: o resumo está abaixo da tabela de canais')})}
});
document.addEventListener('input',e=>{if(e.target.id)fv[e.target.id]=e.target.value});
document.addEventListener('change',e=>{
  const cid=e.target.id||'';if(cid.startsWith('cfg-')){const k=cid.slice(4),el=e.target;let v=Math.round(+el.value);const mn=+el.min,mx=+el.max;if(!isFinite(v))v=CFG0[k];v=Math.min(mx,Math.max(mn,v));const old=CFG[k];CFG[k]=v;el.value=v;saveCfg();if(old!==v)logAud('Parâmetro',`${parLabel(k)}: ${old} → ${v}`);const hp=document.getElementById('histpar');if(hp)hp.outerHTML=histPar();buildAlerts();toast('Parâmetro salvo');return}
  const i=e.target.id;
  if(i==='t-de'){fv['t-de']=e.target.value;render();return}
  if(i==='nf-q'){nfFilt.q=e.target.value;render();return}
  if(i==='aud-tipo'){audF.tipo=e.target.value;render();return}
  if(i==='aud-q'){audF.q=e.target.value;render();return}
  if(i==='role-sel'){const antes=role;role=e.target.value;if(role!=='supervisor'&&role!=='admin'&&role!=='motorista'){qf='meus';uf=''}else{qf='todos';uf=''}logAud('Acesso',`Perfil alterado de ${antes} para ${role} (simulado)`);try{localStorage.setItem('torre_role',role)}catch(x){}const h=location.hash.slice(1);if(role==='motorista'){location.hash='#motorista'}else if(role==='admin'){location.hash='#integracao'}else if(role==='supervisor'){location.hash='#supervisor'}else if(h==='parametros'||h==='supervisor'||h==='auditoria'||h==='desempenho'||h==='integracao'||h==='motorista'){location.hash='#torre'}render();return}
  if(i==='f-st'){filt.st=e.target.value;render()}else if(i==='f-mot'){filt.motivo=e.target.value;render()}else if(i==='f-area'){filt.area=e.target.value;render()}
  else if(i==='d-sel'){drv.rota=+e.target.value;drv.step='list';render()}
});
function goKpi(t){
  const [k,v]=t.dataset.go.split(':'),go=h=>{if(location.hash==='#'+h)render();else location.hash='#'+h},sc=id=>setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),60);
  if(k==='cli'){cliOnly=v!=='todos';cliRec=v==='rec';go('clientes')}
  else if(k==='sup'){if(v==='esc'){go('supervisor');sc('p-esc')}else if(v==='exc'){go('supervisor');sc('p-exc')}else{if(v==='sem')qf='sem';else qf='todos';go('torre')}}
  else if(k==='turno'){if(v==='comp'){go('turno');sc('p-comp')}else{qf='todos';go('torre')}}
  else if(k==='lib'){const L=x=>LIB[x.id],pick=v==='ok'?LIBR.find(x=>L(x).ok):v==='blk'?LIBR.find(x=>lBlk(x).length):v==='res'?LIBR.find(x=>L(x).rem.length||L(x).exc):null;
    if(pick)selLib=pick.id;else if(v!=='todas')toast(v==='ok'?'Nenhuma rota liberada ainda':v==='res'?'Nada resolvido antes da saída ainda':'Nenhuma NF com bloqueio');go('liberacao');if(v==='todas')sc('p-lib')}
  else if(k==='perf'){if(v==='torre'){qf='todos';go('torre')}else{go('desempenho');sc(v)}}
  else if(k==='aud'){audF.tipo=v;audF.q='';go('auditoria')}
  else if(k==='rota'){const r=byId(+t.dataset.rid);nfFilt.st=v==='ALL'?'':v;nfFilt.q=r?r.mot:'';go('nfs')}}
/* atalhos: J/K navega na fila, T trata, Esc fecha */
function openAlerts(){const n=demoMin();return ALERTS.filter(a=>a.estado==='Novo'&&qfOk(a)).sort((a,b)=>(+!!(b.recontato&&b.recontato<=n))-(+!!(a.recontato&&a.recontato<=n))||b.sev-a.sev||a.criado-b.criado)}
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'&&tr){clearTimeout(CT);tr=null;document.getElementById('layer').innerHTML='';return}
  if(e.key==='Escape'&&selRoute&&view==='torre'&&vw==='sem'&&!tr){selRoute=null;selAlert=null;render();return}
  if(tr||view!=='torre')return;
  const l=openAlerts();if(!l.length)return;const i=l.findIndex(a=>a.id===selAlert),k=e.key.toLowerCase();
  if(k==='j'||k==='k'){const n=l[k==='j'?Math.min(l.length-1,i+1):Math.max(0,i<0?0:i-1)];if(vw==='sem'){selAlert=n.id;render()}else selectRoute(n.rota,n.id);setTimeout(()=>document.querySelector('.alert.sel')?.scrollIntoView({block:'nearest'}),30);e.preventDefault()}
  else if(k==='t'){const a=l[i>=0?i:0];openTreat(a.rota,a.id);e.preventDefault()}
});
/* pan e zoom do mapa */
document.addEventListener('pointerdown',e=>{const s=e.target.closest('#map');if(s&&!e.target.closest('[data-route],[data-cl],[data-zstop]')){drag={x:e.clientX,y:e.clientY,vb:{...vb},s};s.setPointerCapture?.(e.pointerId)}});
document.addEventListener('pointermove',e=>{if(!drag)return;const b=drag.s.getBoundingClientRect();vb={...drag.vb,x:drag.vb.x-(e.clientX-drag.x)/b.width*drag.vb.w,y:drag.vb.y-(e.clientY-drag.y)/b.height*drag.vb.h};drag.s.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)});
document.addEventListener('pointerup',()=>{if(drag){drag=null;redrawMap()}});
document.addEventListener('wheel',e=>{const s=e.target.closest('#map');if(!s)return;e.preventDefault();const b=s.getBoundingClientRect(),f=e.deltaY<0?.8:1.25,nw=vb.w*f;if(nw<baseW/25||nw>baseW*1.6)return;const mx=vb.x+(e.clientX-b.left)/b.width*vb.w,my=vb.y+(e.clientY-b.top)/b.height*vb.h;vb={x:mx-(mx-vb.x)*f,y:my-(my-vb.y)*f,w:nw,h:vb.h*f};clearTimeout(wt);wt=setTimeout(redrawMap,20)},{passive:false});
function setHl(rid){document.querySelectorAll('.mk.hl,.alert.hl').forEach(n=>n.classList.remove('hl'));if(rid){document.querySelector('.mk[data-mk="'+rid+'"]')?.classList.add('hl');document.querySelector('.alert[data-alert="A'+rid+'"]')?.classList.add('hl')}}
document.addEventListener('mouseover',e=>{const a=e.target.closest('[data-alert]'),m=e.target.closest('[data-mk]');setHl(a?+a.dataset.alert.slice(1):(m?+m.dataset.mk:null))});
setInterval(()=>{const e=document.getElementById('dtimer');if(e&&view==='motorista'&&drv.step==='deliver'){const x=byId(drv.rota).stops.find(z=>z.nf===drv.stop);if(x)e.innerHTML=dTimerHtml(x)}},1000);
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=hhmm(demoMin());const fc=document.getElementById('feedchip');if(fc)fc.outerHTML=feedChip();checkDue();soundCheck();if(view==='torre'&&!tr&&!drag){buildAlerts();const q=document.querySelector('.queue');const sc=q?q.scrollTop:0;render();const q2=document.querySelector('.queue');if(q2)q2.scrollTop=sc}},20000);
render();
</script>
